name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # NOTE: GitHub Pages must be enabled once by hand in
      # Settings > Pages > Source: "GitHub Actions". The default GITHUB_TOKEN
      # cannot create the Pages site itself (it returns "Resource not accessible
      # by integration"), so this workflow does not try to auto-enable it.

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        # PAGES_BASE_PATH sets basePath/assetPrefix for the project site at
        # https://<user>.github.io/Mycoshield. The path is case-sensitive and
        # must match the repository name exactly (capital M).
        env:
          PAGES_BASE_PATH: /Mycoshield
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
